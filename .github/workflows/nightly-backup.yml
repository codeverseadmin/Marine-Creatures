name: Automated Nightly Database Backup

on:
  schedule:
    # Runs at 02:00 UTC every day (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backup:
    name: Trigger Cloud Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Marine Creatures Backup API
        run: |
          echo "Triggering automated cloud snapshot on Marine Creatures..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://marinecreatures.com' }}/api/admin/backup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          
          echo "Response status: $http_status"
          echo "Response body: $body"
          
          if [ "$http_status" -ne 200 ]; then
            echo "Backup trigger failed with status $http_status"
            exit 1
          fi
          echo "✓ Nightly cloud snapshot successfully captured!"
